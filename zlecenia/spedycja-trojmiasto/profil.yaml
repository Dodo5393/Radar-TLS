pkd:
- 52.29.C  # pozostałe agencje transportowe (spedycja)
- 52.29.A  # morskie agencje transportowe
- 52.29.B  # lotnicze agencje transportowe
- 52.10.B  # magazynowanie w pozostałych składowiskach
- 49.41.Z  # transport drogowy towarów (część spedycji rejestruje się tak)
schemat:
  liczba_pracownikow:
    typ: liczba
    opis: 'Liczba pracowników podana na stronie: „zatrudniamy X osób”, „zespół liczy X osób”,
      „ponad X pracowników”. Przy „ponad X” bierz X.'
  instrukcja_dokumentow_dla_przewoznikow:
    typ: tak_nie
    opis: 'Czy strona instruuje przewoźników lub dostawców, jak przesyłać faktury i dokumenty przewozowe:
      „fakturę wraz z oryginałem CMR prosimy przesłać na…”, „termin płatności liczony od dnia otrzymania
      dokumentów”, „dokumenty przewozowe należy dostarczyć…”. Często w stopce, zakładce Dla przewoźników,
      warunkach zleceń lub OWU.'
  adres_do_dokumentow:
    typ: tekst
    opis: 'Osobny adres e-mail lub pocztowy przeznaczony na faktury lub dokumenty, np. faktury@…,
      dokumenty@…, cmr@…, „korespondencję z dokumentami prosimy kierować na adres…”. Wpisz sam adres.'
  rekrutacja_dokumenty:
    typ: tak_nie
    opis: 'Czy firma rekrutuje na stanowiska związane z obsługą dokumentów i rozliczeń: specjalista ds.
      rozliczeń, fakturzysta, asystent spedytora, pracownik biura ds. dokumentacji, specjalista ds.
      rozliczeń z przewoźnikami. Zakładki Kariera / Praca.'
  liczba_zlecen_rocznie:
    typ: liczba
    opis: 'Wolumen deklarowany na stronie: „X zleceń / transportów / przesyłek / kontenerów rocznie”.
      Wartość miesięczną pomnóż przez 12. Cytat musi zawierać liczbę i jednostkę czasu.'
  uslugi_celne:
    typ: tak_nie
    opis: 'Czy firma świadczy odprawy lub obsługę celną: „agencja celna”, „odprawy celne”, „obsługa celna
      importu i eksportu”.'
  liczba_oddzialow:
    typ: liczba
    opis: 'Liczba oddziałów lub biur firmy (łącznie z centralą): „X oddziałów w Polsce”, lista adresów
      biur. Jedno biuro = 1.'
  systemy_it:
    typ: lista
    opis: 'Nazwy systemów spedycyjnych (TMS), ERP lub księgowych wymienione na stronie, np. w ofertach
      pracy („znajomość systemu X”), opisie integracji, platformie klienta. Same nazwy.'
  automatyzacja_dokumentow:
    typ: tak_nie
    opis: 'Czy strona wprost mówi, że dokumenty przychodzące są już obsługiwane automatycznie: OCR faktur,
      automatyczny odczyt dokumentów, e-faktury przez EDI od przewoźników, elektroniczny obieg dokumentów
      kosztowych. Sam KSeF lub „nowoczesne IT” się nie liczy.'
reguly:
  instrukcja_dla_przewoznikow:
    fakt: instrukcja_dokumentow_dla_przewoznikow
    warunek: prawda
    wartosc: null
    punkty: 25.0
    uzasadnienie: Firma przyjmuje stały strumień faktur i CMR od przewoźników i uzależnia od nich płatność,
      czyli dokładnie ten obieg, który produkt odczytuje i dopasowuje do zleceń.
  rekrutuje_do_dokumentow:
    fakt: rekrutacja_dokumenty
    warunek: prawda
    wartosc: null
    punkty: 20.0
    uzasadnienie: Zatrudnianie ludzi do rozliczeń i dokumentacji oznacza, że obsługa dokumentów jest ręczna
      i rośnie razem z firmą.
  wolumen_zlecen:
    fakt: liczba_zlecen_rocznie
    warunek: '>='
    wartosc: 2000.0
    punkty: 15.0
    uzasadnienie: Od kilku tysięcy zleceń rocznie ręczne dopasowanie kosztów do zleceń staje się pełnym etatem
      i źródłem opóźnień w rozliczeniach.
  osobny_adres_do_dokumentow:
    fakt: adres_do_dokumentow
    warunek: wypelniony
    wartosc: null
    punkty: 10.0
    uzasadnienie: Dedykowana skrzynka na faktury i dokumenty to wejście, które produkt może przejąć bez zmiany
      procesu po stronie przewoźników.
  obsluga_celna:
    fakt: uslugi_celne
    warunek: prawda
    wartosc: null
    punkty: 10.0
    uzasadnienie: Odprawy dokładają dokumenty celne do obiegu każdego zlecenia, zwiększając liczbę dokumentów
      do przepisania.
  kilka_oddzialow:
    fakt: liczba_oddzialow
    warunek: '>='
    wartosc: 2.0
    punkty: 10.0
    uzasadnienie: Dokumenty trafiają do kilku biur, co utrudnia ręczne dopasowanie kosztów do zleceń i centralne
      rozliczenie.
  za_mala_firma:
    fakt: liczba_pracownikow
    warunek: <=
    wartosc: 19.0
    punkty: -100.0
    uzasadnienie: Poniżej widełek 20–300 pracowników.
  za_duza_firma:
    fakt: liczba_pracownikow
    warunek: '>='
    wartosc: 301.0
    punkty: -100.0
    uzasadnienie: Powyżej widełek 20–300 pracowników.
  ma_automatyzacje:
    fakt: automatyzacja_dokumentow
    warunek: prawda
    wartosc: null
    punkty: -40.0
    uzasadnienie: Firma już automatyzuje obieg dokumentów przychodzących, więc problem, który rozwiązuje produkt,
      jest u niej rozwiązany.
