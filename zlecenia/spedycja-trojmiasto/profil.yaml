# Wygenerowano 2026-09-25 modelem hermes:stepfun/step-3.7-flash:free z kontekst.yaml.
# Poprawiony ręcznie 2026-09-25: schemat i reguły na fakty publikowane na stronach, PKD, lokalizacje.
# systemy_it nie ma reguły — służy zaczepce.
